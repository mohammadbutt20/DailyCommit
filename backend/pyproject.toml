[project]
name = "dailycommit"
version = "0.1.0"
description = "Daily Commit backend: API, execution worker, scheduler"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    "docker>=7.1",
    "pyyaml>=6.0",
    "tzdata>=2024.2",  # slim images and Windows have no system tz database
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dailycommit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: needs Docker and the sandbox images (run via make test-sandbox)"]
addopts = "-m 'not sandbox'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # the formatter owns line length; long strings and comments are fine

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder
