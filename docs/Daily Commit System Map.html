
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Commit System Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide labeled schematic, layers as horizontal floors, read top to bottom */
:root{--paper:#F7F9FC;--panel:#FFFFFF;--ink:#16325C;--muted:#4C5F7D;--line:#C9D4E5;--live:#0E8A7B;--danger:#C2452D;--dangerbg:#FDF1EE;--tint:#EEF3FA;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1726;--panel:#172238;--ink:#DCE6F7;--muted:#9DB0CE;--line:#2E3F5E;--live:#3CC7B3;--danger:#F0826B;--dangerbg:#2A1C1C;--tint:#1C2A44;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1726;--panel:#172238;--ink:#DCE6F7;--muted:#9DB0CE;--line:#2E3F5E;--live:#3CC7B3;--danger:#F0826B;--dangerbg:#2A1C1C;--tint:#1C2A44;color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:24px 16px}
header{max-width:1200px;margin:0 auto 16px}
h1{font-size:1.6rem;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.95rem}
.wrap{max-width:1200px;margin:0 auto;overflow-x:auto}
svg{display:block;width:100%;min-width:980px;height:auto}
.band{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:6 5}
.bandt{font:700 15px var(--sans);fill:var(--muted);letter-spacing:.08em}
.bands{font:400 13px var(--sans);fill:var(--muted)}
.bx{fill:var(--panel);stroke:var(--ink);stroke-width:1.2}
.legend{fill:var(--tint);stroke:none}
.sub{fill:var(--tint);stroke:none}
.danger{fill:var(--dangerbg);stroke:var(--danger);stroke-width:1.6}
.tbl,.tick{fill:var(--panel);stroke:var(--line);stroke-width:1}
.h{font:700 22px var(--sans);fill:var(--ink)}
.hd{font:700 22px var(--sans);fill:var(--danger)}
.h2{font:700 17px var(--sans);fill:var(--ink)}
.h3{font:600 16px var(--sans);fill:var(--ink)}
.b{font:400 16px var(--sans);fill:var(--ink)}
.s{font:400 14px var(--sans);fill:var(--muted)}
.mono{font:500 14px var(--mono);fill:var(--muted)}
.mono2{font:400 12.5px var(--mono);fill:var(--ink)}
.a{fill:none;stroke:var(--ink);stroke-width:1.8}
.al{fill:none;stroke:var(--live);stroke-width:1.8;stroke-dasharray:6 4}
.n{fill:var(--ink)} .nl{fill:var(--live)}
.nt{font:700 13px var(--sans);fill:var(--paper)}
#m path{fill:var(--ink)} #ml path{fill:var(--live)}
</style>
<header><h1>Daily Commit system map</h1><p>Follow the numbers 1 to 10 to trace one code submission from click to result. On a phone, scroll sideways.</p></header>
<div class="wrap">
<svg viewBox="0 0 1200 1240" role="img" aria-label="Daily Commit architecture: website, API server, scheduler, PostgreSQL, Redis queue, cache and pub/sub, workers, Docker sandbox, Discord bot and hosting, with numbered arrows for one submission">
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker>
<marker id="ml" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="band" x="10" y="20" width="1180" height="170" rx="16"/>
<text class="bandt" x="30" y="54" text-anchor="start">FRONTEND</text>
<text class="bands" x="30" y="76" text-anchor="start">what you see</text>
<rect class="band" x="10" y="210" width="1180" height="240" rx="16"/>
<text class="bandt" x="30" y="244" text-anchor="start">BACKEND</text>
<text class="bands" x="30" y="266" text-anchor="start">the decisions</text>
<rect class="band" x="10" y="470" width="1180" height="370" rx="16"/>
<text class="bandt" x="30" y="504" text-anchor="start">DATA</text>
<text class="bands" x="30" y="526" text-anchor="start">where info lives</text>
<rect class="band" x="10" y="860" width="1180" height="200" rx="16"/>
<text class="bandt" x="30" y="894" text-anchor="start">CODE</text>
<text class="bands" x="30" y="916" text-anchor="start">runs user code</text>
<rect class="band" x="10" y="1080" width="1180" height="150" rx="16"/>
<text class="bandt" x="30" y="1114" text-anchor="start">LATER</text>
<text class="bands" x="30" y="1136" text-anchor="start">not in the MVP</text>
<rect class="bx" x="240" y="36" width="520" height="138" rx="12"/>
<text class="h" x="264" y="68" text-anchor="start">Website</text>
<text class="mono" x="264" y="90" text-anchor="start">Next.js + TypeScript + Monaco</text>
<text class="b" x="264" y="118" text-anchor="start">The dining room. Problem page, code editor, leaderboard.</text>
<text class="b" x="264" y="140" text-anchor="start">Monaco is the actual VS Code editor, inside the page.</text>
<text class="b" x="264" y="162" text-anchor="start">It only shows things and sends things. Never runs code.</text>
<rect class="legend" x="800" y="36" width="370" height="138" rx="12"/>
<text class="h2" x="822" y="64" text-anchor="start">How to read this</text>
<path class="a" d="M822 88 L872 88" marker-end="url(#m)"/>
<text class="s" x="884" y="93" text-anchor="start">sends something</text>
<path class="al" d="M822 114 L872 114" marker-end="url(#ml)"/>
<text class="s" x="884" y="119" text-anchor="start">sends results back / live</text>
<circle class="n" cx="835" cy="146" r="13"/>
<text class="nt" x="835" y="151" text-anchor="middle">1</text>
<text class="s" x="856" y="151" text-anchor="start">to 10: one submission, in order</text>
<rect class="bx" x="240" y="226" width="520" height="208" rx="12"/>
<text class="h" x="264" y="258" text-anchor="start">API server</text>
<text class="mono" x="264" y="280" text-anchor="start">FastAPI (Python)</text>
<text class="b" x="264" y="310" text-anchor="start">The waiter. The only thing the website talks to.</text>
<text class="b" x="264" y="332" text-anchor="start">Checks your login token (&quot;auth&quot;: proves who you are).</text>
<text class="b" x="264" y="354" text-anchor="start">Saves your code, then hands it off. Never runs it itself.</text>
<text class="b" x="264" y="376" text-anchor="start">Listens for test results and passes them to you.</text>
<text class="b" x="264" y="398" text-anchor="start">Reads today’s problem from the cache first (faster).</text>
<rect class="bx" x="800" y="226" width="370" height="208" rx="12"/>
<text class="h" x="822" y="260" text-anchor="start">Scheduler</text>
<text class="mono" x="822" y="284" text-anchor="start">APScheduler, inside FastAPI</text>
<text class="b" x="822" y="316" text-anchor="start">An alarm clock in the code.</text>
<text class="b" x="822" y="336" text-anchor="start">12 am: new daily problem,</text>
<text class="b" x="822" y="356" text-anchor="start">  check streak (+1 or reset).</text>
<text class="b" x="822" y="376" text-anchor="start">Cutoff: unlock solutions.</text>
<text class="b" x="822" y="396" text-anchor="start">Evening: remind slackers.</text>
<text class="b" x="822" y="416" text-anchor="start">Reads/writes PostgreSQL.</text>
<rect class="bx" x="240" y="486" width="280" height="340" rx="12"/>
<text class="h" x="262" y="520" text-anchor="start">PostgreSQL</text>
<text class="mono" x="262" y="544" text-anchor="start">on disk, permanent</text>
<text class="b" x="262" y="576" text-anchor="start">The filing cabinet.</text>
<text class="b" x="262" y="598" text-anchor="start">If it’s not in here,</text>
<text class="b" x="262" y="620" text-anchor="start">it didn’t happen.</text>
<rect class="tbl" x="262" y="650" width="200" height="20" rx="3"/>
<text class="mono2" x="272" y="665" text-anchor="start">table: users</text>
<rect class="tbl" x="262" y="674" width="200" height="20" rx="3"/>
<text class="mono2" x="272" y="689" text-anchor="start">table: groups</text>
<rect class="tbl" x="262" y="698" width="200" height="20" rx="3"/>
<text class="mono2" x="272" y="713" text-anchor="start">table: problems</text>
<rect class="tbl" x="262" y="722" width="200" height="20" rx="3"/>
<text class="mono2" x="272" y="737" text-anchor="start">table: test_cases</text>
<rect class="tbl" x="262" y="746" width="200" height="20" rx="3"/>
<text class="mono2" x="272" y="761" text-anchor="start">table: submissions</text>
<rect class="tbl" x="262" y="770" width="200" height="20" rx="3"/>
<text class="mono2" x="272" y="785" text-anchor="start">table: streaks</text>
<rect class="tbl" x="262" y="794" width="200" height="20" rx="3"/>
<text class="mono2" x="272" y="809" text-anchor="start">table: ratings</text>
<rect class="bx" x="560" y="486" width="610" height="340" rx="12"/>
<text class="h" x="582" y="520" text-anchor="start">Redis</text>
<text class="mono" x="670" y="520" text-anchor="start">in memory: very fast, temporary</text>
<rect class="sub" x="582" y="536" width="566" height="88" rx="12"/>
<text class="h3" x="600" y="562" text-anchor="start">1. Queue = the ticket rail</text>
<text class="s" x="600" y="586" text-anchor="start">Submissions wait in line. Workers take the oldest first.</text>
<rect class="tick" x="600" y="596" width="82" height="22" rx="3"/>
<text class="mono2" x="641" y="612" text-anchor="middle">job 41</text>
<rect class="tick" x="692" y="596" width="82" height="22" rx="3"/>
<text class="mono2" x="733" y="612" text-anchor="middle">job 42</text>
<rect class="tick" x="784" y="596" width="82" height="22" rx="3"/>
<text class="mono2" x="825" y="612" text-anchor="middle">job 43</text>
<rect class="tick" x="876" y="596" width="82" height="22" rx="3"/>
<text class="mono2" x="917" y="612" text-anchor="middle">job 44</text>
<text class="s" x="980" y="612" text-anchor="start">← next out</text>
<rect class="sub" x="582" y="634" width="566" height="88" rx="12"/>
<text class="h3" x="600" y="660" text-anchor="start">2. Cache = quick memory</text>
<text class="s" x="600" y="684" text-anchor="start">Copies of things everyone asks for, so no trip to PostgreSQL.</text>
<rect class="tick" x="600" y="694" width="256" height="22" rx="3"/>
<text class="mono2" x="610" y="710" text-anchor="start">today_problem → &quot;Two Sum&quot;</text>
<rect class="tick" x="870" y="694" width="256" height="22" rx="3"/>
<text class="mono2" x="880" y="710" text-anchor="start">leaderboard → [top 10 names]</text>
<rect class="sub" x="582" y="732" width="566" height="80" rx="12"/>
<text class="h3" x="600" y="758" text-anchor="start">3. Pub/sub = the kitchen bell</text>
<text class="s" x="600" y="782" text-anchor="start">Worker posts a message on a channel; whoever is listening hears it.</text>
<rect class="tick" x="600" y="790" width="400" height="18" rx="3"/>
<text class="mono2" x="610" y="804" text-anchor="start">channel &quot;sub:42&quot; → &quot;test 3 of 10 passed&quot;</text>
<rect class="bx" x="560" y="876" width="240" height="170" rx="12"/>
<text class="h" x="582" y="910" text-anchor="start">Workers</text>
<text class="mono" x="582" y="934" text-anchor="start">a Python program</text>
<text class="b" x="582" y="964" text-anchor="start">The cooks. Grab the next</text>
<text class="b" x="582" y="985" text-anchor="start">ticket, run it in a sandbox,</text>
<text class="b" x="582" y="1006" text-anchor="start">report each result.</text>
<rect class="danger" x="880" y="876" width="290" height="170" rx="12"/>
<text class="hd" x="902" y="910" text-anchor="start">Sandbox</text>
<text class="mono" x="902" y="934" text-anchor="start">Docker container, 1 per job</text>
<text class="b" x="902" y="962" text-anchor="start">Sealed, throwaway computer.</text>
<text class="s" x="902" y="992" text-anchor="start">• no internet</text>
<text class="s" x="1032" y="992" text-anchor="start">• memory cap</text>
<text class="s" x="902" y="1014" text-anchor="start">• time limit</text>
<text class="s" x="1032" y="1014" text-anchor="start">• process limit</text>
<text class="s" x="902" y="1036" text-anchor="start">• deleted after</text>
<rect class="bx" x="240" y="1096" width="520" height="118" rx="12"/>
<text class="h" x="264" y="1126" text-anchor="start">Discord bot</text>
<text class="mono" x="264" y="1148" text-anchor="start">discord.py</text>
<text class="b" x="264" y="1176" text-anchor="start">Texts the group chat: daily problem, who solved it,</text>
<text class="b" x="264" y="1198" text-anchor="start">streak warnings. The API and scheduler tell it what to say.</text>
<rect class="bx" x="800" y="1096" width="370" height="118" rx="12"/>
<text class="h" x="822" y="1128" text-anchor="start">Hosting</text>
<text class="s" x="822" y="1156" text-anchor="start">One rented server (VPS). Docker Compose</text>
<text class="s" x="822" y="1176" text-anchor="start">starts every box as its own container.</text>
<text class="s" x="822" y="1196" text-anchor="start">Caddy = front door, handles HTTPS.</text>
<path class="a" d="M420 176 L420 222" marker-end="url(#m)"/>
<circle class="n" cx="400" cy="199" r="13"/>
<text class="nt" x="400" y="204" text-anchor="middle">1</text>
<text class="s" x="442" y="204" text-anchor="start">Submit code (REST: asks once)</text>
<path class="al" d="M700 222 L700 178" marker-end="url(#ml)"/>
<circle class="nl" cx="720" cy="199" r="13"/>
<text class="nt" x="720" y="204" text-anchor="middle">9</text>
<text class="s" x="742" y="204" text-anchor="start">Results pushed live (WebSocket: an open line)</text>
<path class="a" d="M300 436 L300 482" marker-end="url(#m)"/>
<circle class="n" cx="280" cy="459" r="13"/>
<text class="nt" x="280" y="464" text-anchor="middle">2</text>
<text class="s" x="322" y="464" text-anchor="start">Save: &quot;pending&quot;</text>
<path class="a" d="M600 436 L600 482" marker-end="url(#m)"/>
<circle class="n" cx="580" cy="459" r="13"/>
<text class="nt" x="580" y="464" text-anchor="middle">3</text>
<text class="s" x="622" y="464" text-anchor="start">To the queue</text>
<path class="al" d="M750 482 L750 438" marker-end="url(#ml)"/>
<circle class="nl" cx="770" cy="459" r="13"/>
<text class="nt" x="770" y="464" text-anchor="middle">8</text>
<text class="s" x="792" y="464" text-anchor="start">Bell heard</text>
<path class="a" d="M640 828 L640 872" marker-end="url(#m)"/>
<circle class="n" cx="620" cy="850" r="13"/>
<text class="nt" x="620" y="855" text-anchor="middle">4</text>
<text class="s" x="600" y="855" text-anchor="end">Grab next ticket</text>
<path class="al" d="M760 872 L760 828" marker-end="url(#ml)"/>
<circle class="nl" cx="780" cy="850" r="13"/>
<text class="nt" x="780" y="855" text-anchor="middle">7</text>
<text class="s" x="802" y="855" text-anchor="start">Ring the bell after each test</text>
<path class="a" d="M802 940 L876 940" marker-end="url(#m)"/>
<circle class="n" cx="840" cy="920" r="13"/>
<text class="nt" x="840" y="925" text-anchor="middle">5</text>
<text class="s" x="840" y="966" text-anchor="middle">run</text>
<path class="al" d="M876 1010 L804 1010" marker-end="url(#ml)"/>
<circle class="nl" cx="840" cy="990" r="13"/>
<text class="nt" x="840" y="995" text-anchor="middle">6</text>
<text class="s" x="840" y="1036" text-anchor="middle">output</text>
<path class="al" d="M560 1020 L380 1020 L380 830" marker-end="url(#ml)"/>
<circle class="nl" cx="400" cy="960" r="13"/>
<text class="nt" x="400" y="965" text-anchor="middle">10</text>
<text class="s" x="422" y="965" text-anchor="start">Save final verdict</text>
</svg></div>
</body></html>
